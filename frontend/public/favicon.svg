<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Candlestick 1: Green Bullish (Left) -->
  <line x1="18" y1="20" x2="18" y2="46" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <rect x="14" y="26" width="8" height="14" rx="2" fill="#10b981" />

  <!-- Candlestick 2: Red Bearish (Center) -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  <rect x="28" y="22" width="8" height="18" rx="2" fill="#ef4444" />

  <!-- Candlestick 3: Green Bullish (Right) -->
  <line x1="46" y1="12" x2="46" y2="40" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <rect x="42" y="16" width="8" height="16" rx="2" fill="#10b981" />

  <!-- Dynamic Upward Trendline -->
  <path d="M10 46 L22 34 L32 38 L54 14" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Bullish Peak Indicator Pulse Node -->
  <circle cx="54" cy="14" r="3.5" fill="#34d399" />
</svg>