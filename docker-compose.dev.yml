version: '3.8'

services:
    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: oi_kafka
        ports:
            - "9092:9092"
            - "29092:29092"
        environment:
            # KRaft Settings (ZooKeeper-Free)
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
            KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    timescaledb:
        image: timescale/timescaledb:latest-pg15
        container_name: oi_timescaledb
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-open_interest}
        ports:
            - "5432:5432"
        volumes:
            - ./init-db:/docker-entrypoint-initdb.d

    pgbouncer:
        image: edoburu/pgbouncer:latest
        container_name: oi_pgbouncer
        depends_on:
            - timescaledb
        environment:
            DB_USER: ${POSTGRES_USER:-postgres}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            DB_HOST: timescaledb
            DB_NAME: ${POSTGRES_DB:-open_interest}
            POOL_MODE: transaction
            MAX_CLIENT_CONN: 200
            DEFAULT_POOL_SIZE: 20
            AUTH_TYPE: plain
            LISTEN_PORT: 6432
        ports:
            - "6432:6432"

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: oi_kafka_ui
        depends_on:
            - kafka
        ports:
            - "8080:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: local-cluster
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
